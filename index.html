<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCCYBER Premium Game</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="compact-ui.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="bg-scanlines"></div>
  <main class="game-shell" id="lockedShell" style="min-height:80vh;display:flex;align-items:center;justify-content:center;text-align:center;">
    <section class="intro-card" style="max-width:760px;">
      <img src="logo.png" alt="SCCYBER logo" class="logo">
      <div class="intro-title">CHECKING ACCESS</div>
      <div class="intro-text">Please wait while your premium access is verified.</div>
    </section>
  </main>
  <iframe id="gameFrame" title="SCCYBER premium game" src="about:blank" style="display:none;width:100%;height:100vh;border:0;background:#090216;"></iframe>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://sccyber.github.io/Immersive-Training-Package/supabase-config.js"></script>
  <script>
    const shell = document.getElementById('lockedShell');
    const frame = document.getElementById('gameFrame');

    function locked(msg){
      shell.innerHTML='<section class="intro-card" style="max-width:760px;"><img src="logo.png" alt="SCCYBER logo" class="logo"><div class="intro-title">PORTAL ACCESS REQUIRED</div><div class="intro-text">'+msg+'<br><br>Please return to the SCCYBER Training Portal and launch this module from your dashboard.</div><a class="action-btn primary-btn" style="display:inline-block;text-decoration:none;margin-top:18px;" href="https://sccyber.github.io/Immersive-Training-Package/">RETURN TO PORTAL</a></section>';
    }

    window.addEventListener('message', function(event){
      const data = event.data || {};

      if (data.type === 'SCCYBER_GAME_ATTEMPT') {
        window.parent.postMessage(data, '*');
        return;
      }

      if (data.type === 'SCCYBER_REQUEST_ATTEMPT') {
        try {
          frame.contentWindow.postMessage(data, '*');
        } catch(e) {}
      }
    });

    async function run(){
      try{
        if (window.top === window.self) {
          locked('Direct access is not allowed.');
          return;
        }

        const c=window.supabase.createClient(window.SCCYBER_SUPABASE_URL,window.SCCYBER_SUPABASE_ANON_KEY);
        const s=await c.auth.getSession();
        const user=s&&s.data&&s.data.session&&s.data.session.user;
        if(!user){locked('No active portal session was found.');return;}
        const p=await c.from('profiles').select('premium_enabled,is_admin').eq('id',user.id).single();
        if(p.error||!p.data){locked('Your account could not be verified.');return;}
        if(p.data.is_admin===true||p.data.premium_enabled===true){shell.style.display='none';frame.style.display='block';frame.src='bf-core-917a.html?portal=1';return;}
        locked('Premium access is not active for this account.');
      }catch(e){locked('Secure access check failed.');}
    }

    run();
  </script>
</body>
</html>
